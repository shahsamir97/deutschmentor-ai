[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "google-cloud-texttospeech>=2.38.0",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "openai>=3.39.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = ["."]
